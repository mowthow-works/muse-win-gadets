[package]
name = "muse-desktop-mascot"
version = "0.9.0"
description = "Desktop gadget for Windows to interact with Muse AI"
authors = ["kusak"]
edition = "2021"

[lib]
name = "muse_desktop_mascot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2.1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["time"] }
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
